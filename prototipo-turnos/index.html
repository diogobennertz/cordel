<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mata Adentro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header id="hud">
      <div id="floor-name" class="title"></div>
      <div class="bar-wrap">
        <span class="label">Vida</span>
        <div class="bar"><div id="hp-fill" class="fill hp"></div><div id="shield-fill" class="fill shield"></div><span id="hp-text" class="bar-text"></span></div>
      </div>
      <div class="bar-wrap">
        <span class="label" id="lvl-text">Nv 1</span>
        <div class="bar"><div id="xp-fill" class="fill xp"></div><span id="xp-text" class="bar-text"></span></div>
      </div>
      <div id="stats"></div>
    </header>
    <main>
      <div id="board">
        <canvas id="game"></canvas>
        <div id="overlay" class="hidden"></div>
      </div>
      <aside id="side">
        <section><h3>Mochila</h3><ol id="inv"></ol></section>
        <section><h3>À vista</h3><ul id="near"></ul></section>
        <section><h3>Talentos</h3><ul id="perks"></ul></section>
      </aside>
    </main>
    <footer id="log"></footer>
  </div>
  <script src="src/rng.js"></script>
  <script src="src/data.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/game.js"></script>
  <script src="src/ui.js"></script>
</body>
</html>
