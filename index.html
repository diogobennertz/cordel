<body>
  <canvas id="game"></canvas>
  <div id="overlay" class="overlay" hidden></div>

  <!-- filtro que deixa bordas e botões tremidos, como papel cortado à mão -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="cru" x="-6%" y="-12%" width="112%" height="124%">
    <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="4" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
  </filter></svg>
  <div id="sndbar"><button id="btn-mute" type="button" aria-label="Som"></button><button id="btn-music" type="button" aria-label="Música"></button></div>
